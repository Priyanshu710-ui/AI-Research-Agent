<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">AI Research Agent architecture</title>
  <desc id="desc">A visual pipeline showing the user topic flowing through Next.js, FastAPI, Gemini and Tavily into a cited research report and PDF export.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172033"/><stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".3"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="60" y="62" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">AI Research Agent</text>
  <text x="60" y="91" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="15">Agentic research pipeline · retrieval · synthesis · citations · visuals · PDF</text>

  <g filter="url(#shadow)">
    <rect x="60" y="150" width="210" height="90" rx="16" fill="url(#card)" stroke="#334155"/>
    <rect x="315" y="150" width="210" height="90" rx="16" fill="url(#card)" stroke="#334155"/>
    <rect x="570" y="150" width="250" height="90" rx="16" fill="url(#card)" stroke="#334155"/>
    <rect x="865" y="150" width="275" height="90" rx="16" fill="url(#card)" stroke="#334155"/>

    <rect x="315" y="335" width="210" height="90" rx="16" fill="url(#card)" stroke="#334155"/>
    <rect x="570" y="335" width="250" height="90" rx="16" fill="url(#card)" stroke="#334155"/>
    <rect x="865" y="335" width="275" height="90" rx="16" fill="url(#card)" stroke="#334155"/>
  </g>

  <g font-family="Inter,Arial,sans-serif" text-anchor="middle">
    <text x="165" y="185" fill="#5eead4" font-size="13" font-weight="700">01 · INPUT</text>
    <text x="165" y="211" fill="#f8fafc" font-size="19" font-weight="700">Research Topic</text>

    <text x="420" y="185" fill="#93c5fd" font-size="13" font-weight="700">02 · FRONTEND</text>
    <text x="420" y="211" fill="#f8fafc" font-size="19" font-weight="700">Next.js / React</text>

    <text x="695" y="185" fill="#c4b5fd" font-size="13" font-weight="700">03 · ORCHESTRATION</text>
    <text x="695" y="211" fill="#f8fafc" font-size="19" font-weight="700">FastAPI Research Agent</text>

    <text x="1002" y="185" fill="#d8b4fe" font-size="13" font-weight="700">04 · AI + RETRIEVAL</text>
    <text x="1002" y="211" fill="#f8fafc" font-size="19" font-weight="700">Gemini + Tavily</text>

    <text x="420" y="370" fill="#5eead4" font-size="13" font-weight="700">05 · SYNTHESIS</text>
    <text x="420" y="396" fill="#f8fafc" font-size="19" font-weight="700">Cited Report</text>

    <text x="695" y="370" fill="#93c5fd" font-size="13" font-weight="700">06 · VISUALS</text>
    <text x="695" y="396" fill="#f8fafc" font-size="19" font-weight="700">Section Images</text>

    <text x="1002" y="370" fill="#fbbf24" font-size="13" font-weight="700">07 · OUTPUT</text>
    <text x="1002" y="396" fill="#f8fafc" font-size="19" font-weight="700">PDF + Research Workspace</text>
  </g>

  <g fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M270 195 H315"/>
    <path d="M525 195 H570"/>
    <path d="M820 195 H865"/>
    <path d="M1002 240 V335"/>
    <path d="M865 380 H820"/>
    <path d="M570 380 H525"/>
    <path d="M315 380 H230 V285 H165 V240"/>
  </g>

  <text x="60" y="550" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="13">Plan → Search → Collect → Synthesize → Cite → Illustrate → Export</text>
  <text x="1140" y="550" text-anchor="end" fill="#475569" font-family="Inter,Arial,sans-serif" font-size="12">portfolio architecture</text>
</svg>
